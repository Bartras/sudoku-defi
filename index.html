<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku – Le Défi</title>
<meta name="theme-color" content="#1f7ae0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#1c2430;--muted:#6b7686;--line:#c5cdd8;--thick:#2b3442;
  --accent:#1f7ae0;--sel:#cfe3fb;--peer:#e8f0fa;--same:#a9cdf6;--given:#1c2430;--user:#1f7ae0;
  --err:#d93a3a;--errbg:#fbdede;--ok:#1f9d55;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121821;--card:#1b2330;--ink:#e6ebf2;--muted:#8d99ab;--line:#3a4658;--thick:#9fb0c6;
  --accent:#5aa2f5;--sel:#27456b;--peer:#222c3b;--same:#355f93;--given:#e6ebf2;--user:#5aa2f5;
  --err:#ff6b6b;--errbg:#4a2326;--ok:#4cc57f;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:16px;min-height:100vh}
h1{margin:4px 0 0;font-size:1.5rem}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 12px}
.bar{display:flex;justify-content:space-between;align-items:center;width:min(92vw,460px);margin-bottom:8px;font-variant-numeric:tabular-nums}
.bar b{font-size:1.1rem}
#board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));width:min(92vw,460px);aspect-ratio:1;background:var(--card);
  border:3px solid var(--thick);border-radius:6px;user-select:none;touch-action:manipulation}
.cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(1.2rem,5.6vw,1.9rem);
  border:1px solid var(--line);cursor:pointer;color:var(--user)}
.cell.g{color:var(--given);font-weight:700}
.cell.h{color:var(--ok);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{padding:5px 10px;font-size:.8rem;border-radius:99px}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#boardList{list-style:none;margin:0;padding:0;text-align:left;font-variant-numeric:tabular-nums}
#boardList li{display:flex;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);align-items:baseline}
#boardList li.me{background:var(--peer);font-weight:700}
#boardList .t{font-weight:700;min-width:3.4em}
#boardList .m{color:var(--muted);font-size:.8rem;flex:1}
dialog#dBoard{width:min(92vw,400px)}
.cell:nth-child(9n+3),.cell:nth-child(9n+6){border-right:2px solid var(--thick)}
.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--thick)}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel);outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
.cell.err{background:var(--errbg);color:var(--err)}
.notes{position:absolute;inset:1px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  font-size:clamp(.5rem,2.2vw,.72rem);color:var(--muted);font-weight:400;line-height:1}
.notes span{display:flex;align-items:center;justify-content:center}
#pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;width:min(92vw,460px);margin-top:12px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 0;cursor:pointer}
button:active{transform:scale(.96)}
#pad button{font-size:1.3rem;font-weight:600;position:relative;padding:8px 0 14px}
#pad small{position:absolute;bottom:2px;left:0;right:0;font-size:.62rem;color:var(--muted);font-weight:400}
#tools{display:flex;gap:6px;width:min(92vw,460px);margin-top:8px}
#tools button{flex:1;font-size:.85rem;padding:9px 2px}
#tools button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#msg{min-height:1.4em;margin-top:10px;font-weight:600;text-align:center}
.win{color:var(--ok)}
dialog{border:none;border-radius:12px;background:var(--card);color:var(--ink);max-width:min(90vw,380px);text-align:center;padding:24px}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 6px}
dialog .big{font-size:2.2rem;font-weight:700;margin:8px 0;font-variant-numeric:tabular-nums}
dialog .row{display:flex;gap:8px;margin-top:14px}
dialog .row button{flex:1}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#menu{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left}
.card h2{margin:0 0 4px;font-size:1.05rem}
.card p{margin:0 0 10px;color:var(--muted);font-size:.85rem}
button.big{display:block;width:100%;text-align:left;padding:12px 14px}
button.big b{display:block;font-size:1rem}
button.big span{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
button.big em{display:block;font-style:normal;font-size:.8rem;margin-top:4px;color:var(--accent)}
button.big em.ok{color:var(--ok)}
#levels{display:grid;gap:8px}
#menu .card>button+button{margin-top:8px}
.top{display:flex;justify-content:space-between;width:min(92vw,460px);margin-bottom:6px}
.top button{padding:6px 12px;font-size:.85rem}
[hidden]{display:none!important}
footer{margin-top:auto;padding-top:20px;color:var(--muted);font-size:.78rem}
</style>
</head>
<body>
<h1>Sudoku</h1>
<div class="sub" id="sub"></div>

<div id="menu">
  <button class="card big" id="mDaily"><b>🏆 Défi du jour</b><span>Grille n° 72 · niveau 6 (Hard) du cahier · 26 chiffres donnés</span><em id="mDailyState"></em></button>
  <div class="card">
    <h2>🎲 Grille aléatoire</h2>
    <p>Choisis un niveau : chaque grille est unique et a une seule solution.</p>
    <div id="levels"></div>
    <button class="big" id="mResume" hidden></button>
  </div>
  <button class="card big" id="mBoard"><b>🏅 Classement</b><span>Tes meilleurs temps sur cet appareil</span></button>
  <div id="mGen" class="sub" style="text-align:center;min-height:1.2em"></div>
</div>

<div id="game" hidden style="display:flex;flex-direction:column;align-items:center;width:100%">
<div class="top"><button id="bMenu">← Menu</button><button id="bLink" hidden>🔗 Lien du défi</button></div>
<div class="bar"><span>⏱ <b id="time">00:00</b></span><span>Erreurs : <b id="errs">0</b></span><span>Restant : <b id="left">0</b></span></div>
<div id="board" role="grid" aria-label="Grille de Sudoku"></div>
<div id="pad"></div>
<div id="tools">
  <button id="bNotes">✏️ Notes : off</button>
  <button id="bUndo">↶ Annuler</button>
  <button id="bErase">⌫ Effacer</button>
  <button id="bCheck">✔ Vérifier</button>
</div>
<div id="msg"></div>
<div id="tools" style="margin-top:4px">
  <button id="bHint">💡 Indice (+30 s)</button>
  <button id="bReset">↺ Recommencer</button>
</div>
</div>

<dialog id="dBoard">
  <h2>🏅 Classement</h2>
  <div class="chips" id="boardChips"></div>
  <ol id="boardList"></ol>
  <div class="row"><button id="bBoardClear">Effacer</button><button id="bBoardClose" class="primary">Fermer</button></div>
</dialog>

<dialog id="dlg">
  <h2>🎉 Grille résolue !</h2>
  <div>Temps</div><div class="big" id="dTime"></div>
  <div id="dInfo" style="color:var(--muted)"></div>
  <div class="row"><button id="bShare" class="primary">Copier mon résultat</button><button id="bClose">Fermer</button></div>
</dialog>

<footer>Clavier : 1-9 saisir · flèches se déplacer · N notes · Suppr effacer · Ctrl+Z annuler</footer>

<script src="engine.js"></script>

<script>
const E=SudokuEngine;
const DAILY={
  // Grille n°72 (niveau 6) — "." = case vide. Source : cahier, chiffres imprimés uniquement.
  puzzle:
   ".1.8.5.4."+
   "..9..2..."+
   ".3.6....8"+
   "..49....6"+
   "..3...7.."+
   "2....43.."+
   "3....1.7."+
   "...5..4.."+
   ".2.4.9.5.",
  key:"sudoku-defi-72-v1"
};
const RKEY="sudoku-aleatoire-v1";
const LEVEL_INFO={
  facile:"≈ 40 chiffres · cases à une seule possibilité",
  moyen:"≈ 32 chiffres · il faut repérer les chiffres uniques d'une ligne, colonne ou bloc",
  difficile:"≈ 28 chiffres · paires et alignements à exploiter",
  expert:"≈ 24 à 30 chiffres · techniques avancées"
};

let game=null; // {kind:"daily"} | {kind:"random",level,seed}
let given=[];
let vals,notes,hinted,hints=0,sol=null,sel=-1,noteMode=false,errors=0,seconds=0,hist=[],done=false,timer=null;

const $=id=>document.getElementById(id);
const board=$("board");
const cells=[];
for(let i=0;i<81;i++){
  const d=document.createElement("div");d.className="cell";d.dataset.i=i;
  d.addEventListener("pointerdown",e=>{e.preventDefault();select(i)});
  board.appendChild(d);cells.push(d);
}
const pad=$("pad");
for(let n=1;n<=9;n++){
  const b=document.createElement("button");b.innerHTML=n+"<small></small>";b.dataset.n=n;
  b.addEventListener("click",()=>input(n));pad.appendChild(b);
}

function fresh(){
  vals=given.slice();notes=Array.from({length:81},()=>0);hinted=Array(81).fill(0);hints=0;
  errors=0;seconds=0;hist=[];done=false;sel=-1;
}
const storeKey=()=>game.kind==="daily"?DAILY.key:RKEY;
function save(){
  if(!game)return;
  const o={vals,notes,hinted,hints,errors,seconds,done};
  if(game.kind==="random"){o.level=game.level;o.seed=game.seed;o.started=vals.some((v,i)=>v&&!given[i]);}
  try{localStorage.setItem(storeKey(),JSON.stringify(o))}catch(e){}
}
function readSave(key){try{const s=JSON.parse(localStorage.getItem(key));if(s&&s.vals&&s.vals.length===81)return s;}catch(e){}return null}
function load(){
  const s=readSave(storeKey());
  if(!s)return false;
  if(game.kind==="random"&&(s.level!==game.level||s.seed!==game.seed))return false;
  vals=s.vals;notes=s.notes;hinted=s.hinted||Array(81).fill(0);hints=s.hints||0;errors=s.errors;seconds=s.seconds;done=!!s.done;return true;
}
function fmt(s){return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

function conflict(i){
  const v=vals[i];if(!v)return false;
  const r=i/9|0,c=i%9;
  for(let k=0;k<81;k++){if(k===i||vals[k]!==v)continue;
    const kr=k/9|0,kc=k%9;
    if(kr===r||kc===c||(kr/3|0)===(r/3|0)&&(kc/3|0)===(c/3|0))return true;}
  return false;
}

function render(){
  const sv=sel>=0?vals[sel]:0;
  let left=0;const count=Array(10).fill(0);
  for(let i=0;i<81;i++){
    const d=cells[i],v=vals[i];
    if(!v)left++;else count[v]++;
    d.className="cell"+(given[i]?" g":hinted[i]?" h":"");
    if(sel>=0){
      const r=i/9|0,c=i%9,sr=sel/9|0,sc=sel%9;
      if(i===sel)d.classList.add("sel");
      else if(sv&&v===sv)d.classList.add("same");
      else if(r===sr||c===sc||(r/3|0)===(sr/3|0)&&(c/3|0)===(sc/3|0))d.classList.add("peer");
    }
    if(!given[i]&&v&&conflict(i))d.classList.add("err");
    if(v){d.textContent=v;}
    else if(notes[i]){
      let h='<div class="notes">';
      for(let n=1;n<=9;n++)h+="<span>"+(notes[i]&(1<<n)?n:"")+"</span>";
      d.innerHTML=h+"</div>";
    }else d.textContent="";
  }
  $("left").textContent=left;$("errs").textContent=errors;$("time").textContent=fmt(seconds);
  [...pad.children].forEach(b=>{const n=+b.dataset.n;b.querySelector("small").textContent=9-count[n]>0?"×"+(9-count[n]):"";b.style.opacity=count[n]>=9?.35:1;});
  $("bNotes").textContent="✏️ Notes : "+(noteMode?"on":"off");
  $("bNotes").classList.toggle("on",noteMode);
}

function select(i){sel=i;render()}
function push(){hist.push({vals:vals.slice(),notes:notes.slice(),hinted:hinted.slice(),errors});if(hist.length>200)hist.shift()}

function input(n){
  if(done||sel<0||given[sel]||hinted[sel])return;
  push();
  if(noteMode){
    if(vals[sel]){hist.pop();return;}
    notes[sel]^=(1<<n);
  }else{
    if(vals[sel]===n){vals[sel]=0;}
    else{
      vals[sel]=n;notes[sel]=0;
      if(conflict(sel))errors++;
      // purge des notes en conflit
      const r=sel/9|0,c=sel%9;
      for(let k=0;k<81;k++){const kr=k/9|0,kc=k%9;
        if(kr===r||kc===c||(kr/3|0)===(r/3|0)&&(kc/3|0)===(c/3|0))notes[k]&=~(1<<n);}
    }
  }
  after();
}
function erase(){
  if(done||sel<0||given[sel]||hinted[sel])return;
  if(!vals[sel]&&!notes[sel])return;
  push();vals[sel]=0;notes[sel]=0;after();
}
function undo(){
  if(done||!hist.length)return;
  const h=hist.pop();vals=h.vals;notes=h.notes;hinted=h.hinted;errors=h.errors;after(true);
}
function after(noWin){
  render();save();
  if(!noWin&&vals.every(v=>v)&&!vals.some((v,i)=>conflict(i)))win();
}
function win(){
  done=true;clearInterval(timer);save();
  $("msg").textContent="Grille résolue en "+fmt(seconds)+" !";$("msg").className="win";
  $("dTime").textContent=fmt(seconds);
  const rank=recordScore();
  $("dInfo").textContent=errors+" erreur"+(errors>1?"s":"")+(hints?" · "+hints+" indice"+(hints>1?"s":""):"")+" · "+title()
    +(rank===0?" — 🏅 meilleur temps !":rank>0?" — classement : n° "+(rank+1):"");
  $("dlg").showModal();
}
function check(){
  if(done)return;
  const bad=vals.reduce((n,v,i)=>n+(v&&conflict(i)?1:0),0);
  const m=$("msg");m.className="";
  if(bad){m.textContent=bad+" case"+(bad>1?"s":"")+" en conflit (doublon ligne, colonne ou bloc)";}
  else{m.textContent="Aucun doublon pour l'instant 👍";m.className="win";}
}
function reset(){
  if(!confirm("Recommencer la grille depuis zéro ?"))return;
  $("dlg").open&&$("dlg").close();
  fresh();$("msg").textContent="";$("msg").className="";save();startTimer();render();
}
function startTimer(){
  clearInterval(timer);if(done)return;
  timer=setInterval(()=>{if(document.hidden)return;seconds++;$("time").textContent=fmt(seconds);if(seconds%5===0)save();},1000);
}

$("bNotes").onclick=()=>{noteMode=!noteMode;render()};
$("bUndo").onclick=undo;$("bErase").onclick=erase;$("bCheck").onclick=check;$("bReset").onclick=reset;
$("bClose").onclick=()=>$("dlg").close();
$("bShare").onclick=async()=>{
  const t="J'ai résolu le Sudoku « "+title()+" » en "+fmt(seconds)+" avec "+errors+" erreur"+(errors>1?"s":"")+(hints?" et "+hints+" indice"+(hints>1?"s":""):"")+". À toi de faire mieux ! "+shareUrl();
  try{await navigator.clipboard.writeText(t);$("bShare").textContent="Copié ✔";}catch(e){prompt("Copie ce texte :",t);}
};
$("bLink").onclick=async()=>{
  try{await navigator.clipboard.writeText(shareUrl());$("bLink").textContent="Copié ✔";}catch(e){prompt("Copie ce lien :",shareUrl());}
  setTimeout(()=>$("bLink").textContent="🔗 Lien du défi",1500);
};

document.addEventListener("keydown",e=>{
  if(!game)return;
  if(e.ctrlKey||e.metaKey){if(e.key.toLowerCase()==="z"){e.preventDefault();undo();}return;}
  if(/^[1-9]$/.test(e.key))input(+e.key);
  else if(e.key==="Backspace"||e.key==="Delete"||e.key==="0")erase();
  else if(e.key.toLowerCase()==="n")$("bNotes").click();
  else if(e.key.startsWith("Arrow")){
    e.preventDefault();if(sel<0){select(40);return;}
    let r=sel/9|0,c=sel%9;
    if(e.key==="ArrowUp")r=(r+8)%9;if(e.key==="ArrowDown")r=(r+1)%9;
    if(e.key==="ArrowLeft")c=(c+8)%9;if(e.key==="ArrowRight")c=(c+1)%9;
    select(r*9+c);
  }
});

// ---------- Indice ----------
function candCount(i){
  let m=0;
  for(let k=0;k<81;k++)if(vals[k]&&(E.ROW[k]===E.ROW[i]||E.COL[k]===E.COL[i]||E.BOX[k]===E.BOX[i]))m|=1<<vals[k];
  let c=0;for(let v=1;v<=9;v++)if(!(m&(1<<v)))c++;return c;
}
function hint(){
  if(done||!game)return;
  sol=sol||E.solve(given);
  const m=$("msg");m.className="";
  const wrong=vals.findIndex((v,i)=>v&&!given[i]&&!hinted[i]&&v!==sol[i]);
  seconds+=30;hints++;
  if(wrong>=0){
    sel=wrong;m.textContent="Indice : la case sélectionnée contient une erreur (+30 s)";
    render();save();return;
  }
  let t=sel>=0&&!vals[sel]?sel:-1;
  if(t<0){let best=10;for(let i=0;i<81;i++)if(!vals[i]){const c=candCount(i);if(c<best){best=c;t=i;}}}
  if(t<0)return;
  push();
  vals[t]=sol[t];hinted[t]=1;notes[t]=0;sel=t;
  const v=vals[t];
  for(let k=0;k<81;k++)if(E.ROW[k]===E.ROW[t]||E.COL[k]===E.COL[t]||E.BOX[k]===E.BOX[t])notes[k]&=~(1<<v);
  m.textContent="Indice : la case sélectionnée vaut "+v+" (+30 s)";
  after();
}
$("bHint").onclick=hint;

// ---------- Classement (local à l'appareil) ----------
const SKEY="sudoku-defi-scores-v1";
const CATS=[["daily","Défi du jour"],["facile","Facile"],["moyen","Moyen"],["difficile","Difficile"],["expert","Expert"]];
function readScores(){try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return {}}}
function writeScores(o){try{localStorage.setItem(SKEY,JSON.stringify(o))}catch(e){}}
function recordScore(){
  const all=readScores(),cat=game.kind==="daily"?"daily":game.level;
  const e={t:seconds,e:errors,h:hints,d:Date.now()};
  const list=all[cat]=(all[cat]||[]).concat(e).sort((a,b)=>a.t-b.t||a.e-b.e||a.d-b.d);
  all[cat]=list.slice(0,10);writeScores(all);
  lastEntry=e;return all[cat].indexOf(e);
}
let lastEntry=null,boardCat="daily";
function renderBoard(){
  const all=readScores(),ol=$("boardList");
  [...$("boardChips").children].forEach(b=>b.classList.toggle("on",b.dataset.c===boardCat));
  const list=all[boardCat]||[];
  ol.innerHTML=list.length?"":"<li><span class='m'>Aucune partie terminée dans cette catégorie.</span></li>";
  list.forEach((e,i)=>{
    const li=document.createElement("li");if(lastEntry&&e.t===lastEntry.t&&e.d===lastEntry.d)li.className="me";
    const dt=new Date(e.d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
    li.innerHTML="<span>"+(["🥇","🥈","🥉"][i]||(i+1)+".")+"</span><span class='t'>"+fmt(e.t)+"</span><span class='m'>"+e.e+" erreur"+(e.e>1?"s":"")+(e.h?" · "+e.h+" indice"+(e.h>1?"s":""):"")+" · "+dt+"</span>";
    ol.appendChild(li);
  });
}
for(const [c,l] of CATS){
  const b=document.createElement("button");b.textContent=l;b.dataset.c=c;
  b.onclick=()=>{boardCat=c;renderBoard()};$("boardChips").appendChild(b);
}
$("mBoard").onclick=()=>{renderBoard();$("dBoard").showModal()};
$("bBoardClose").onclick=()=>$("dBoard").close();
$("bBoardClear").onclick=()=>{
  if(!confirm("Effacer les temps de la catégorie « "+CATS.find(c=>c[0]===boardCat)[1]+" » ?"))return;
  const all=readScores();delete all[boardCat];writeScores(all);renderBoard();
};

// ---------- Menu et sélection de partie ----------
const LVL=E.LEVELS;
const title=()=>game.kind==="daily"?"Défi du jour (grille n° 72)":"Grille aléatoire "+LVL[game.level].label+" #"+game.seed;
const shareUrl=()=>game.kind==="daily"?location.origin+location.pathname:location.origin+location.pathname+"#g="+game.level+"-"+game.seed;

function stateLabel(s,el){
  el.className=s&&s.done?"ok":"";
  el.textContent=!s?"Pas encore commencée":s.done?"✔ Résolue en "+fmt(s.seconds):"En cours · "+fmt(s.seconds);
}
function showMenu(){
  if(game){save();clearInterval(timer);}
  game=null;$("dlg").open&&$("dlg").close();
  $("game").hidden=true;$("menu").hidden=false;
  $("sub").textContent="Choisis une partie";
  history.replaceState(null,"",location.pathname);
  stateLabel(readSave(DAILY.key),$("mDailyState"));
  const r=readSave(RKEY),b=$("mResume");
  b.hidden=!r||!LVL[r.level];
  if(!b.hidden)b.innerHTML="<b>▶ Reprendre la grille aléatoire</b><span>"+LVL[r.level].label+" #"+r.seed+"</span><em></em>",stateLabel(r,b.querySelector("em"));
}
function openGame(g,puzzleStr){
  game=g;sol=null;given=[...puzzleStr].map(c=>c==="."?0:+c);
  fresh();if(!load())fresh();
  $("menu").hidden=true;$("game").hidden=false;$("mGen").textContent="";
  $("bLink").hidden=g.kind==="daily";
  $("sub").textContent=g.kind==="daily"?"Défi du jour · Grille n° 72 · niveau 6 (Hard) · 26 chiffres donnés"
    :"Grille aléatoire · "+LVL[g.level].label+" · #"+g.seed+" · "+given.filter(x=>x).length+" chiffres donnés";
  $("msg").textContent=done?"Grille résolue en "+fmt(seconds)+" !":"";$("msg").className=done?"win":"";
  if(g.kind==="random")history.replaceState(null,"","#g="+g.level+"-"+g.seed);
  save();startTimer();render();
}
function startRandom(level,seed){
  $("mGen").textContent="Génération de la grille…";
  setTimeout(()=>{ // laisse le navigateur afficher le message avant le calcul
    const {puzzle}=E.generate(level,seed);
    openGame({kind:"random",level,seed},puzzle.map(v=>v||".").join(""));
  },30);
}
function newRandom(level){
  const r=readSave(RKEY);
  if(r&&!r.done&&r.started&&!confirm("Une grille aléatoire est en cours : l'abandonner pour une nouvelle ?"))return;
  startRandom(level,1+Math.floor(Math.random()*999999));
}

for(const k of Object.keys(LVL)){
  const b=document.createElement("button");b.className="big";
  b.innerHTML="<b>"+LVL[k].label+"</b><span>"+LEVEL_INFO[k]+"</span>";
  b.onclick=()=>newRandom(k);$("levels").appendChild(b);
}
$("mDaily").onclick=()=>openGame({kind:"daily"},DAILY.puzzle);
$("mResume").onclick=()=>{const r=readSave(RKEY);startRandom(r.level,r.seed);};
$("bMenu").onclick=showMenu;
window.addEventListener("pagehide",()=>{if(game)save()});

// Lien de défi : #g=niveau-graine
function fromHash(){
  const m=/^#g=(\w+)-(\d+)$/.exec(location.hash);
  if(!m||!LVL[m[1]])return false;
  if(game&&game.kind==="random"&&game.level===m[1]&&game.seed===+m[2])return true;
  if(game)save();
  startRandom(m[1],+m[2]);return true;
}
window.addEventListener("hashchange",fromHash);
if(!fromHash())showMenu();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
